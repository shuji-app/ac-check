<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="エアコン点検">
  <meta name="theme-color" content="#1B3A6B">
  <title>エアコン点検システム</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; height: -webkit-fill-available;
      overflow: hidden; -webkit-text-size-adjust: 100%;
    }
    body { background: #1B3A6B; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    #root { background: #F1F5F9; }
    #loading {
      position: fixed; inset: 0; background: #1B3A6B;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 99999; transition: opacity 0.5s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .icon { font-size: 52px; }
    #loading .title { color:#fff; font-size:20px; font-weight:800; font-family:'Hiragino Sans',sans-serif; }
    #loading .sub { color:rgba(255,255,255,0.6); font-size:13px; font-family:'Hiragino Sans',sans-serif; }
    #loading .err { color:#FCA5A5; font-size:12px; max-width:300px; text-align:center; line-height:1.6; font-family:'Hiragino Sans',sans-serif; margin-top:8px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="icon">🌡️</div>
    <div class="title">エアコン点検システム</div>
    <div class="sub" id="sub">React を読み込み中...</div>
    <div class="err" id="err"></div>
  </div>
  <div id="root"></div>

  <!-- ① React・ReactDOM を同期読み込み（bodyの末尾で確実にロード） -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- ② app.js を同期読み込み -->
  <script>document.getElementById('sub').textContent = 'アプリを読み込み中...';</script>
  <script src="./app.js"></script>

  <!-- ③ 全て読み込まれた後にマウント -->
  <script>
    (function() {
      var sub = document.getElementById('sub');
      var err = document.getElementById('err');

      // エラーチェック
      if (!window.React || !window.ReactDOM) {
        sub.style.display = 'none';
        err.textContent = 'エラー: Reactの読み込みに失敗しました。インターネット接続を確認してください。';
        return;
      }
      if (!window.__AC_APP__) {
        sub.style.display = 'none';
        err.textContent = 'エラー: app.jsの読み込みに失敗しました。ファイルを確認してください。';
        return;
      }

      // マウント
      try {
        sub.textContent = '起動中...';
        ReactDOM.createRoot(document.getElementById('root'))
          .render(React.createElement(window.__AC_APP__));
        document.getElementById('loading').classList.add('hide');
      } catch(e) {
        sub.style.display = 'none';
        err.textContent = '起動エラー: ' + e.message;
      }

      // Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      }
    })();
  </script>
</body>
</html>
